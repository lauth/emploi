# Local k3d cluster (adrs/0005-local-kubernetes-with-k3d.md). Created by `make cluster-create`.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: emploi
servers: 1
agents: 0
# Every port is published on the loopback addresses only: the API has no
# authentication, so nothing may reach the cluster from the network
# (adrs/0028-cluster-reachable-from-localhost-only.md).
kubeAPI:
  hostIP: 127.0.0.1
ports:
  # Traefik (adrs/0006-local-domains-https-traefik-mkcert.md), on IPv4 and IPv6:
  # *.localhost resolves to ::1 on the dev machine.
  - port: 127.0.0.1:80:80
    nodeFilters:
      - loadbalancer
  - port: '[::1]:80:80'
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:443:443
    nodeFilters:
      - loadbalancer
  - port: '[::1]:443:443'
    nodeFilters:
      - loadbalancer
  # PostgreSQL NodePort (k8s/postgres.yaml), for the Prisma CLI and tools on the host.
  - port: 127.0.0.1:54320:30432
    nodeFilters:
      - loadbalancer
volumes:
  # Named Docker volume holding the database (adrs/0027-named-volume-for-data.md).
  # Unlike the node's anonymous volumes, `k3d cluster delete` keeps it, and the
  # PersistentVolume of k8s/postgres.yaml points at a fixed path inside it, so a
  # recreated cluster finds the same database.
  - volume: emploi-data:/var/lib/emploi
    nodeFilters:
      - server:0
