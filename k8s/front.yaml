apiVersion: v1
kind: ConfigMap
metadata:
  name: front
  labels:
    app.kubernetes.io/name: front
data:
  # The front calls the API from the server, inside the cluster
  # (adrs/0012-front-calls-api-from-server.md).
  API_URL: http://back
  # Time zone used to display timestamps (pages are rendered on the server).
  TZ: Europe/Paris
---
apiVersion: v1
kind: Service
metadata:
  name: front
  labels:
    app.kubernetes.io/name: front
spec:
  selector:
    app.kubernetes.io/name: front
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  labels:
    app.kubernetes.io/name: front
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: front
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: front
          # Built locally and imported with `make images` (no registry).
          image: emploi-front:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: front
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # Next.js writes its cache here; the rest of the filesystem is read-only.
            - name: next-cache
              mountPath: /app/front/.next/cache
      volumes:
        - name: next-cache
          emptyDir: {}
