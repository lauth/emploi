apiVersion: v1
kind: ConfigMap
metadata:
  name: back
  labels:
    app.kubernetes.io/name: back
data:
  PORT: '3000'
  CORS_ORIGINS: https://emploi.localhost
  # Swagger UI at https://api.emploi.localhost/docs (adrs/0018-openapi-documentation.md).
  API_DOCS_ENABLED: 'true'
  # Offer images, on the persistent volume below (adrs/0031-offer-image.md).
  IMAGES_DIR: /var/lib/emploi/images
---
# The offer image files, at a fixed path of the node: the named Docker volume
# `emploi-data` (k8s/k3d-cluster.yaml) is mounted at /var/lib/emploi, so the
# images outlive the pods, the node container and the cluster, like the
# database (adrs/0027-named-volume-for-data.md, adrs/0031-offer-image.md).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: emploi-images
  labels:
    app.kubernetes.io/name: back
spec:
  capacity:
    storage: 5Gi
  accessModes: ['ReadWriteOnce']
  storageClassName: ''
  # Never deleted with its claim: the images stay.
  persistentVolumeReclaimPolicy: Retain
  # Reserved for the claim below.
  claimRef:
    namespace: emploi
    name: offer-images
  hostPath:
    path: /var/lib/emploi/images
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: offer-images
  labels:
    app.kubernetes.io/name: back
spec:
  # Bound to the fixed PersistentVolume above, not provisioned on the fly.
  storageClassName: ''
  volumeName: emploi-images
  # One node: the old and new back pods of a rollout share it.
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: back
  labels:
    app.kubernetes.io/name: back
spec:
  selector:
    app.kubernetes.io/name: back
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  labels:
    app.kubernetes.io/name: back
spec:
  replicas: 1
  # Zero-downtime rollouts: the new pod is ready before the old one stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # The node creates the hostPath directory as root: hand it to the API's
        # user. The only step that runs as root, with no capability but CHOWN.
        - name: images-owner
          image: emploi-back:dev
          imagePullPolicy: Never
          command: ['chown', '1000:1000', '/var/lib/emploi/images']
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
              add: ['CHOWN']
          volumeMounts:
            - name: images
              mountPath: /var/lib/emploi/images
      containers:
        - name: back
          # Built locally and imported with `make images` (no registry).
          image: emploi-back:dev
          imagePullPolicy: Never
          lifecycle:
            # Keep serving while Traefik and kube-proxy stop routing to this pod;
            # without it, requests during a rollout hit a stopped pod (502).
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: back
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: emploi-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # The only writable path: the offer images.
            - name: images
              mountPath: /var/lib/emploi/images
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: offer-images
