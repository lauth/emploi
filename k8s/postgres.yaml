apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Exposed on the host at 127.0.0.1:54320 through the k3d load balancer (k8s/k3d-cluster.yaml).
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: emploi-db
          readinessProbe:
            exec:
              command:
                ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Bound to the fixed PersistentVolume below, not provisioned on the fly.
        storageClassName: ''
        volumeName: emploi-postgres
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
---
# The database files, at a fixed path of the node: the named Docker volume
# `emploi-data` (k8s/k3d-cluster.yaml) is mounted at /var/lib/emploi, so the
# data outlives the cluster and a recreated cluster reuses it
# (adrs/0027-named-volume-for-data.md).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: emploi-postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  capacity:
    storage: 1Gi
  accessModes: ['ReadWriteOnce']
  storageClassName: ''
  # Never deleted with its claim: the data stays.
  persistentVolumeReclaimPolicy: Retain
  # Reserved for the StatefulSet's claim.
  claimRef:
    namespace: emploi
    name: data-postgres-0
  hostPath:
    path: /var/lib/emploi/postgres
    type: DirectoryOrCreate
